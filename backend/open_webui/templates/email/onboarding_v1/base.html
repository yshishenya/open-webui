<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>{% block title %}AIRIS{% endblock %}</title>
	</head>
	<body
		style="
			margin: 0;
			background: #f7f7fa;
			color: #20202a;
			font:
				16px/1.6 Arial,
				sans-serif;
		"
	>
		<table role="presentation" style="width: 100%; border-collapse: collapse">
			<tr>
				<td style="padding: 24px 12px">
					<table
						role="presentation"
						style="
							width: 100%;
							max-width: 600px;
							margin: auto;
							background: white;
							border-collapse: collapse;
						"
					>
						<tr>
							<td style="padding: 28px">
								<p style="margin: 0 0 24px; font-weight: bold">AIRIS</p>
								{% block content %}{% endblock %}
								<p style="margin-top: 28px">
									Нужна помощь?{% if support_reply_to %} Ответьте на это письмо или напишите
									<a href="mailto:{{ support_reply_to }}">{{ support_reply_to }}</a>.{% else %}
									Откройте <a href="{{ guide_url }}">руководство AIRIS</a>.{% endif %}
								</p>
								<p style="color: #555565">Команда AIRIS</p>
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
