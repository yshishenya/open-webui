# Include in the nginx http context before server blocks.
# Opt-in per application server: access_log <existing-path> airis_email_privacy;
map $uri $airis_email_logged_uri {
    default $request_uri;
    ~^/api/v1/email-preferences/one-click/ /api/v1/email-preferences/one-click/[redacted];
}

map $uri $airis_email_referrer_policy {
    default strict-origin-when-cross-origin;
    /unsubscribe no-referrer;
    ~^/api/v1/email-preferences/one-click/ no-referrer;
}

# Do not log arbitrary headers that could contain the link secret.
log_format airis_email_privacy '$remote_addr - $remote_user [$time_local] '
    '"$request_method $airis_email_logged_uri $server_protocol" '
    '$status $body_bytes_sent';
