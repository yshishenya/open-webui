services:
  postgres:
    image: postgres:16-alpine
    container_name: open-webui-postgres
    environment:
      POSTGRES_USER: openwebui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openwebui_password}
      POSTGRES_DB: openwebui
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwebui"]
      interval: 10s
      timeout: 5s
      retries: 5

  open-webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-0.8.12}
    container_name: open-webui
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./open-webui-data:/app/backend/data
    ports:
      - ${OPEN_WEBUI_PORT-3287}:8080
    environment:
      - 'WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}'
      - 'ENABLE_FORWARD_USER_INFO_HEADERS=true'
      - 'DATABASE_URL=postgresql://openwebui:${POSTGRES_PASSWORD:-openwebui_password}@postgres:5432/openwebui'
      - 'CONTENT_EXTRACTION_ENGINE='
      - 'TIKA_SERVER_URL='
      - 'CHAT_STREAM_RESPONSE_CHUNK_MAX_BUFFER_SIZE=${CHAT_STREAM_RESPONSE_CHUNK_MAX_BUFFER_SIZE:-10485760}'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
  backup-tool:
    build:
      context: ./backup-tool
      dockerfile: Dockerfile
    env_file:
      - ./.env
      - ./backup-tool/.env
    environment:
      TELEGRAM_PROXY_URL: http://host.docker.internal:18081
    volumes:
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/backups/open-webui:/opt/backups/open-webui
      - /home/alex/.ssh:/root/.ssh:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    working_dir: /workspace
    entrypoint: ["python", "/workspace/backup-tool/backup-scripts/open_webui_backup.py"]
    command: ["schedule", "--env", "/workspace/backup-tool/.env", "--project-dir", "/workspace"]
    restart: unless-stopped
